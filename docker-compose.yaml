version: "3.12"

services:
  web:
    build: .
    command: sh -c "python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    expose:
      - '8000'
#    depend_on:
#      - db
#      - redis
    env_file:
      - .env

  nginx:
    build:
      context: ./nginx
    ports:
      - "8888:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - static_volume:/app/staticfiles
    depend_on:
      - web

  db:
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      POSTGRES_PASSWORD: "$PASSWORD"
    healthcheck:
      test: ["CMD-SHELL", "-c", "pg_isready -U $USER -d $NAME"]
      interval: 30s
      retries: 5
      timeout: 10s


  redis:
    image: redis:latest
    volumes:
      - redis_data:/data
    env_file:
      - .env

  celery:
    build: .
    tty: true
    command: celery -A config worker --loglevel=info
    restart: on-failure
    volumes:
      - .:/app
    depends_on:
      - redis
      - db
      - app
    env_file:
      - .env

    celery-beat:
      build: .
      tty: true
      command: celery -A config beat --loglevel=info
      restart: on-failure
      volumes:
        - .:/app
      depends_on:
        - redis
        - db
        - app
      env_file:
        - .env

volumes:
  postgres_data:
  static_volume: