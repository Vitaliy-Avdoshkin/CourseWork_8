services:
  nginx:
    container_name: nginx
    build:
      context: ./nginx
    ports:
      - "8888:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - static_volume:/app/staticfiles

  db:
    container_name: db
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: "PASSWORD"
      POSTGRES_NAME: "NAME"
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - .env
    healthcheck:
      test: [ "CMD-SHELL", "-c", "pg_isready -U $USER -d $NAME" ]
      interval: 30s
      retries: 5
      timeout: 10s

  web:
    container_name: app
    build: .
    tty: true
    command: sh -c "python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    expose:
      - '8000'
    env_file:
      - .env

  redis:
    container_name: redis
    image: redis:7
    volumes:
      - redis_data:/data
    env_file:
      - ./.env

  celery:
    container_name: celery
    build: .
    tty: true
    command: sh -c "celery -A config.celery worker --loglevel=info -B"
    volumes:
      - .:/app
    depends_on:
      - redis
      - db
      - web
    env_file:
      - .env

  celery-beat:
    container_name: celery-beat
    build: .
    tty: true
    command: sh -c "celery -A config.celery beat --loglevel=INFO"
    volumes:
      - .:/app
    depends_on:
      - redis
      - db
      - web
    env_file:
      - .env

volumes:
  postgres_data:
  static_volume:
  redis_data:
