version: "3.12"

services:

  redis:
    image: redis:latest
    volumes:
      - redis_data:/data
    env_file:
      - ./.env

  app:
    build: .
    command: sh -c "python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    expose:
      - "8000"
    env_file:
      - ./.env

  nginx:
    build:
      context: ./nginx
    ports:
      - "8888:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - static_volume:/app/staticfiles
    depends_on:
      - app

  db:
    image: postgres:16
    env_file:
      - .env
    expose:
      - "5432"
    environment:
      POSTGRES_PASSWORD: "$PASSWORD"
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "-c", "pg_isready -U $USER -d $NAME"]
      interval: 30s
      retries: 5
      timeout: 10s

  celery:
    build: .
    tty: true
    command: celery -A config
    restart: on-failure
    volumes:
      - .:/app
    depends_on:
      - redis
      - db
      - app
    env_file:
      - .env

  celery-beat:
    build: .
    tty: true
    command: celery -A config beat
    restart: on-failure
    volumes:
      - .:/app
    depends_on:
      - redis
      - db
      - app
    env_file:
      - .env


volumes:
  postgres_data:
  static_volume:
  redis_data: